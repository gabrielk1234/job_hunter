{% extends "base.html" %}

{% block title %}系統首頁 - JobHunter{% endblock %}

{% block content %}
<div class="flex items-center justify-center h-full min-h-screen bg-gray-50">
    <div class="text-center transform transition-all hover:scale-105 duration-300">
        <div class="bg-indigo-100 text-indigo-600 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
            <i class="fa-solid fa-satellite-dish text-4xl animate-pulse"></i>
        </div>
        <h1 class="text-4xl font-black text-gray-800 mb-4 tracking-tight">歡迎來到 <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-indigo-600">JobHunter</span> 系統</h1>
        <p class="text-gray-500 text-lg mb-8">請從左側選單選擇您要執行的任務。</p>
        
        <div class="flex justify-center space-x-4">
            <a href="/dashboard" class="px-6 py-3 bg-white border border-gray-200 text-gray-700 rounded-xl font-medium hover:bg-gray-50 hover:shadow-md transition-all">
                <i class="fa-solid fa-chart-pie mr-2 text-indigo-500"></i> 前往儀表板
            </a>
            <a href="/scrapper" class="px-6 py-3 bg-indigo-600 text-white rounded-xl font-medium shadow-lg shadow-indigo-500/30 hover:bg-indigo-700 hover:-translate-y-1 transition-all">
                <i class="fa-solid fa-spider mr-2"></i> 啟動爬蟲
            </a>
        </div>
    </div>
</div>
{% endblock %}
